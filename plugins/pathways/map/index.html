<!doctype html>
<html lang="en">
<title>Pathways · Wellness landscape</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --ground:#003830;         /* the floor colour: goandco's first stop (landscape v2 default) */
    --panel:rgba(20,10,30,.74);
    --sidebar:color-mix(in srgb, color-mix(in srgb, var(--ground) 95%, #fff) 72%, transparent);   /* the theme panel: the floor plus 5% white, as glass */
    --glass-tone:.85;         /* the map behind the glass is dimmed on dark scales (lifted on light) to keep the text legible */
    --panel-line:color-mix(in srgb, var(--accent) 22%, transparent);
    --ink:rgba(255,255,255,.94);   /* text: white / black at an opacity, never a tint, so it sits on any colour scale */
    --ink-dim:rgba(255,255,255,.6);
    --accent:#fff;            /* UI chrome: white on dark scales, black on light (applyRamp) */
    --on-accent:#000;         /* text on an accent fill */
    --off:color-mix(in srgb, var(--accent) 5%, transparent);   /* unselected controls: 5% white or black */
    --label-ink:#fff;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --radius:8px;             /* controls and the panel; what sits inside them is rounded concentrically */
    --radius-in:5px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--sans);overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}

  /* ---- overlay chrome ---- */
  .overlay{position:absolute;pointer-events:none;z-index:5}
  .overlay > *{pointer-events:auto}

  .topbar{top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;gap:16px;padding:20px 22px}
  .topbar-left{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
  .tabs{display:flex;gap:3px;padding:3px;background:var(--off);border:1px solid var(--panel-line);
    border-radius:var(--radius);backdrop-filter:blur(8px)}
  .tab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:color-mix(in srgb, var(--accent) 66%, transparent);background:none;border:0;border-radius:var(--radius-in);padding:7px 13px;cursor:pointer;
    transition:color .15s,background .15s}
  .tab:hover{color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  button.ctl{
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);
    background:var(--off);border:1px solid var(--panel-line);
    border-radius:var(--radius);padding:8px 12px;cursor:pointer;
    backdrop-filter:blur(8px);transition:border-color .15s,color .15s,background .15s}
  button.ctl:hover{border-color:var(--accent);color:var(--accent)}
  button.ctl[aria-pressed="true"]{border-color:var(--accent);color:var(--on-accent);
    background:var(--accent)}
  button.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- controls dock: an accordion in the bottom left, Theme and Terrain tabs ---- */
  .dock[hidden]{display:none !important}
  .dock{left:22px;bottom:20px;width:248px;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--panel-line);border-radius:var(--radius);backdrop-filter:blur(8px)}
  .dock-head{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
    background:none;border:0;padding:9px 12px;cursor:pointer}
  .dock-head:hover{color:var(--accent)}
  .dock-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dock-head .chev{transition:transform .2s}
  .dock-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .dock-body{border-bottom:1px solid var(--panel-line);padding:10px 12px 12px;
    max-height:calc(100vh - 200px);overflow:auto}
  .dock-body[hidden],.dock-pane[hidden]{display:none}
  .dock-tabs{margin-bottom:12px;background:none;border:0;padding:0;backdrop-filter:none}
  .dock-tabs .tab{flex:1}

  /* ---- camera: a map-style stack in the bottom right, zoom at the foot ---- */
  .camera{right:22px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .cam-btn{display:grid;place-items:center;width:36px;height:36px;padding:0;cursor:pointer;
    font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink);
    background:var(--off);border:1px solid var(--panel-line);border-radius:var(--radius);backdrop-filter:blur(8px);
    transition:border-color .15s,color .15s,background .15s}
  .cam-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .cam-btn:hover{border-color:var(--accent);color:var(--accent)}
  .cam-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cam-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  #compass path{stroke:none;fill:currentColor;opacity:.45}
  #compass path.n{opacity:1}
  .cam-zoom{display:flex;flex-direction:column;border:1px solid var(--panel-line);border-radius:var(--radius);overflow:hidden;
    background:var(--off);backdrop-filter:blur(8px)}
  .cam-zoom .cam-btn{border:0;border-radius:0;background:none;backdrop-filter:none}
  .cam-zoom .cam-btn + .cam-btn{border-top:1px solid var(--panel-line)}
  .legend .lbl{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px}
  .legend .n{color:var(--accent);letter-spacing:.04em}
  .industry-legend{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
  .industry-legend li{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:.04em;color:var(--ink-dim);line-height:1.3}
  .industry-legend .swatch{width:8px;height:8px;border-radius:1px;flex:none}
  .industry-legend .cnt{margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums}
  /* steps: 1 Structure · 2 Signal · 3 Uniqueness */
  .tabs .tab .ico{width:13px;height:13px;margin:-2px 6px 0 0;vertical-align:middle;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .subset-tabs[hidden],.rule-tabs[hidden],.mode-tabs[hidden],.plays[hidden]{display:none}
  .label[data-layer="emergent"] .txt{font-style:italic}
  .label[data-layer="emergent"] .dot{width:8px;height:7px;border-radius:0;
    clip-path:polygon(50% 0,100% 100%,0 100%)}                  /* a solid triangle marks a new (emergent) theme */
  /* light themes (ember, orchid): dark ink on a pale floor */
  :root[data-light]{--ink:rgba(0,0,0,.88);--ink-dim:rgba(0,0,0,.58);--label-ink:#000;--panel:rgba(255,255,255,.78);--sidebar:color-mix(in srgb, color-mix(in srgb, var(--ground) 95%, #000) 72%, transparent);--glass-tone:1.1;
    --panel-line:color-mix(in srgb, var(--ink) 18%, transparent);
    --v-leader:#1f9d55;--v-leader-potential:#5fa82a;--v-whitespace:#c99700;--v-conditional:#d9730d;--v-follower-risk:#d6323a;--v-avoid:#8a8494;--v-unscored:#c9c4d1}
  :root[data-light] .related .bar{background:rgba(0,0,0,.08)}
  :root[data-light] .labels.dim .label:not(.active):not(.related):not(.hover){opacity:.45}
  :root[data-light] .bubbles.dim .b:not(.active):not(.related):not(.hover) .inner{opacity:.4}
  :root{--v-leader:#3ddc84;--v-leader-potential:#a6e86b;--v-whitespace:#ffd34d;--v-conditional:#ffa64d;--v-follower-risk:#ff5a5f;--v-avoid:#7a7486;--v-unscored:#4b4556}
  .label[data-verdict] .dot{width:9px;height:9px}
  .label[data-verdict="leader"] .dot{background:var(--v-leader)} .label[data-verdict="leader-potential"] .dot{background:var(--v-leader-potential)}
  .label[data-verdict="whitespace"] .dot{background:var(--v-whitespace)} .label[data-verdict="conditional"] .dot{background:var(--v-conditional)}
  .label[data-verdict="follower-risk"] .dot{background:var(--v-follower-risk)} .label[data-verdict="avoid"] .dot{background:var(--v-avoid)}
  .label[data-verdict="unscored"] .dot{background:var(--v-unscored)} .label[data-verdict="unscored"] .txt{opacity:.5}
  .label[data-nodemand]:not(.hover):not(.active) .txt{opacity:.4}
  .bubbles .b[data-verdict="leader"] .outer{stroke:var(--v-leader)} .bubbles .b[data-verdict="leader-potential"] .outer{stroke:var(--v-leader-potential)}
  .bubbles .b[data-verdict="whitespace"] .outer{stroke:var(--v-whitespace)} .bubbles .b[data-verdict="conditional"] .outer{stroke:var(--v-conditional)}
  .bubbles .b[data-verdict="follower-risk"] .outer{stroke:var(--v-follower-risk)} .bubbles .b[data-verdict="avoid"] .outer{stroke:var(--v-avoid)}
  .bubbles .b[data-verdict="unscored"] .outer{stroke:var(--v-unscored)}
  .bubbles .b[data-verdict] .outer{stroke-width:3;opacity:1}
  .bubbles .b[data-verdict="unscored"] .outer{stroke-width:1}
  .bubbles .b[data-verdict]:not(.active):not(.related) .inner{stroke:none}   /* let the verdict ring read cleanly */
  .verdict-chip{display:inline-block;padding:2px 7px;border-radius:2px;font-family:var(--mono);font-size:10px;color:#111;margin-right:6px}
  .plays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:1.45}
  .plays .why{color:var(--ink-dim)} .plays .jv{font-style:italic}
  .mcard{display:flex;flex-direction:column;gap:14px;font-size:12.5px;line-height:1.45}
  .mcard .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mcard .tile{border:1px solid var(--panel-line);border-radius:8px;padding:10px 12px}
  .mcard .tile .k{font-size:11px;color:var(--ink-dim)} .mcard .tile .v{font-size:26px;font-weight:600;line-height:1.15;margin:2px 0}
  .mcard .tile .t{font-size:11.5px;color:var(--ink-dim)}
  .mcard .head{border:1px solid color-mix(in srgb, var(--v-conditional) 60%, transparent);background:color-mix(in srgb, var(--v-conditional) 12%, transparent);border-radius:8px;padding:10px 12px}
  .mcard h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
  .mcard .bar{display:grid;grid-template-columns:78px 1fr 36px;align-items:center;gap:8px;margin:3px 0}
  .mcard .bar .track{height:6px;border-radius:3px;background:color-mix(in srgb, var(--ink-dim) 22%, transparent);overflow:hidden}
  .mcard .bar .fill{height:100%;border-radius:3px;background:#8fb4ff}
  .mcard table{width:100%;border-collapse:collapse} .mcard td,.mcard th{padding:4px 4px 4px 0;text-align:left;vertical-align:top}
  .mcard td{font-size:12px} .mcard th{font-weight:400;color:var(--ink-dim);font-size:11px} .mcard td.n{font-variant-numeric:tabular-nums}
  .mcard td.dim{min-width:96px}
  .mcard .box{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--panel-line);border-radius:999px;padding:1px 8px;white-space:nowrap;font-size:11.5px}
  .mcard .box i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .mcard .lead{display:flex;justify-content:space-between;gap:10px;margin:3px 0} .mcard .lead .s{color:var(--ink-dim);text-align:right}
  .mcard .dim{color:var(--ink-dim)}
  .mcard .lowconf{display:inline-block;margin-left:6px;font-size:.6em;vertical-align:super;color:var(--v-conditional);cursor:help}
  .mcard .lead .s .lowconf{margin:0 5px 0 0;font-size:.9em;vertical-align:baseline}
  .brand-dna{font-family:var(--mono);font-size:9.5px;line-height:1.5;margin-top:8px;color:var(--ink-dim)}
  .ramp{height:8px;border-radius:1px;margin-bottom:5px;cursor:pointer}
  .ramp:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .ramp-ends{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:10px;color:var(--ink-dim)}

  .minimap{margin-top:12px}
  .minimap .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:8px}
  .minimap canvas{display:block;width:100%;height:auto;aspect-ratio:1;border:1px solid var(--panel-line);border-radius:1px}
  @media (max-width:640px){ .minimap{display:none} }

  .eroder .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:10px}
  .eroder .row{margin-bottom:9px}
  .eroder label{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
  .eroder .n{color:var(--accent);letter-spacing:0}
  .eroder input{width:100%;margin:0;accent-color:var(--accent);cursor:pointer}
  .ramps{display:flex;gap:7px;align-items:center;margin-top:10px}
  .rchip{width:22px;height:22px;padding:2px;border-radius:50%;background:none;cursor:pointer;
    border:2px solid transparent;transition:border-color .15s,transform .15s}
  .rchip i{display:block;width:100%;height:100%;border-radius:50%}
  .rchip:hover{transform:scale(1.12)}
  .rchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rchip[aria-pressed="true"]{border-color:var(--ink)}
  .ramp-default{margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);background:none;border:1px solid var(--panel-line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .ramp-default:hover:not(:disabled){border-color:var(--accent)}
  .ramp-default:disabled{color:var(--ink-dim);cursor:default}
  .ramp-default:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


  /* ---- projected theme labels ---- */
  /* ---- first load: the controls fade up, a loader sits in the middle, labels wait for the terrain ---- */
  @keyframes uiFadeUp{from{opacity:0}to{opacity:1}}
  #app.booting .overlay{animation:uiFadeUp 2s ease-in-out both}
  .labels,.range-labels{transition:opacity .9s ease}
  #app.intro .range-labels{opacity:0}
  .labels.flat,.bubbles{transition:opacity .2s ease}
  .labels.swap,.bubbles.swap{opacity:0}                                    /* the bubbles pane changing level */
  #app.view-fx .labels,#app.view-fx .range-labels{transition:none}   /* Terrain ⇄ Bubbles drives their fades a frame at a time */
  /* mid-intro each label waits for its hill to reach full height, then builds on: fades up, rises, its dot pops */
  #app.intro .label,.labels.build .label{transition:opacity .6s ease}
  #app.intro .label .txt,.labels.build .label .txt{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
  #app.intro .label .dot,.labels.build .label .dot{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
  #app.intro .label:not(.grown),.labels.build .label:not(.grown):not(.leaving){opacity:0}
  #app.intro .label:not(.grown) .txt,.labels.build .label:not(.grown):not(.leaving) .txt{transform:translateY(6px)}
  #app.intro .label:not(.grown) .dot,.labels.build .label:not(.grown):not(.leaving) .dot{transform:scale(0)}
  /* while a new layout rolls in, the old layout's labels bow out as the roll reaches them */
  .label.leaving{pointer-events:none}
  .labels.build .label.leaving{transition:opacity .35s ease}
  .label.leaving.gone{opacity:0}
  .label.leaving.gone .txt{transform:translateY(-6px)}
  .label.leaving.gone .dot{transform:scale(0)}
  .range-labels.build{opacity:0}
  .loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .5s ease}
  .loader.done{opacity:0}
  .loader-text{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    text-shadow:0 0 6px var(--ground),0 0 12px var(--ground)}   /* legible over the contours drawing on behind it */
  @keyframes loaderText{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .loader-text.swap{animation:loaderText .35s ease}
  .loader-bar{width:160px;height:2px;border-radius:1px;overflow:hidden;background:var(--off)}
  .loader-bar i{display:block;width:100%;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
  @media (prefers-reduced-motion: reduce){ #app.booting .overlay{animation:none} .loader-text.swap{animation:none} }
  .labels{position:absolute;top:0;bottom:0;left:0;width:100%;z-index:4;overflow:hidden;pointer-events:none}
  .labels.flat .label .dot{display:none}
  /* where a selected document's arcs fan out: a solid dot carrying a document icon */
  .doc-hub{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--label-ink);color:var(--ground);box-shadow:0 0 0 4px color-mix(in srgb, var(--label-ink) 22%, transparent);pointer-events:none;z-index:1}
  .doc-hub svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .labels.flat .label{pointer-events:none}     /* in the bubbles view the circles take the clicks */
  .divider{position:absolute;top:0;bottom:0;width:1px;background:var(--panel-line);z-index:4;pointer-events:none;display:none}
  /* anchored at the dot, which sits on the peak; the name floats just above it */
  .label{position:absolute;left:0;top:0;transform:translate(-50%,-100%);
    white-space:nowrap;will-change:transform;pointer-events:auto;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:0;margin:0;padding:2px 4px 3px;font:inherit;color:inherit}
  /* every label wears the same ink (white on the dark scales, black on the light ones); a soft halo in the
     floor colour keeps it legible on the bright peaks. Hover and the selected theme invert it into a pill. */
  .label .txt,.range-label .txt{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--label-ink);
    text-shadow:0 0 3px var(--ground),0 0 1px var(--ground);
    padding:4px 11px;border-radius:999px;transition:background-color .15s,color .15s}
  .label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);transition:transform .15s}   /* a solid dot, no ring */
  /* hover is shared by theme across the panes (setHover), so a split view lights the same theme on both sides */
  .label.hover .txt,.label.active .txt{background:var(--label-ink);color:var(--on-accent);text-shadow:none}
  .label.hover,.label.active{z-index:2}
  .label:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  .label.active .txt{font-weight:600}
  .label.active .dot{background:var(--accent);transform:scale(1.35)}

  /* ---- side panel: theme metadata + connections ---- */
  /* floats clear of the edges, inset like the other controls (20px top and bottom, 22px at the side) */
  .panel{position:absolute;top:0;right:0;bottom:0;width:min(var(--panel-w,560px),100vw);z-index:6;
    background:var(--sidebar);backdrop-filter:blur(28px) saturate(1.8) brightness(var(--glass-tone));
    -webkit-backdrop-filter:blur(28px) saturate(1.8) brightness(var(--glass-tone));
    border:1px solid var(--panel-line);border-radius:var(--radius);
    display:flex;flex-direction:column;gap:32px;
    padding:22px 22px 28px;overflow-y:auto;transform:translateX(calc(100% + 30px));
    transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  .panel.open{transform:none}
  .panel{border-radius:0;border-width:0 0 0 1px}
  .panel-resize{position:absolute;top:0;bottom:0;right:var(--panel-w,560px);width:10px;transform:translateX(50%);z-index:7;cursor:col-resize;display:none;touch-action:none}
  .panel-resize::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;background:var(--accent);opacity:0;transition:opacity .15s}
  .panel-resize:hover::after,.panel-resize:focus-visible::after,.panel-resize.dragging::after{opacity:.7}
  .panel-resize:focus-visible{outline:none}
  #app.panel-open .panel-resize{display:block}
  #app.resizing,#app.resizing *{cursor:col-resize !important;user-select:none}
  #app.resizing .panel{transition:none}
  @media (max-width:640px){ #app.panel-open .panel-resize{display:none} }
  .panel > *{flex:none;margin:0}
  .panel > [hidden]{display:none}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);border-radius:999px;padding:3px 9px}
  /* the map's markers, in the panel too: a solid circle for a structure theme, a solid triangle for an emergent one */
  /* the key, under the level toggle: the terrain marks its themes with a circle or a triangle; the bubbles say it
     with a dashed outline for an emergent theme. Split shows both. */
  .map-key{display:flex;gap:14px;margin:2px 4px 0 0;padding:0;list-style:none;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:color-mix(in srgb, var(--accent) 66%, transparent);

    background:color-mix(in srgb, currentColor 38%, transparent)}

  /* in Split each side has its own level toggle, under the top bar at its top left; the single one hides */

  #app.tab-split .topright .level-tabs,#app.view-fx .pane-level{display:none}
  @media (max-width:560px){ .pane-level .ico{display:none} .pane-level .tab{padding:7px 8px;letter-spacing:.04em} }
  .mark{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}

  .figures{display:flex;flex-direction:column;gap:6px}

  .kpis div.perf-kpi span{color:var(--ink)}
  .gbar{display:block;margin-top:2px;width:100%}
  .gbar-cap{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-family:var(--mono);font-size:10px;letter-spacing:0;text-transform:none;color:var(--ink-dim)}
  .gbar-cap span:nth-child(2){color:var(--ink)}
  .kpis .gbar-cap span{font-size:10px;letter-spacing:0;text-transform:none}
  .kpis .gbar-cap span:nth-child(2){color:var(--ink)}
  .stats dd .gbar{margin-top:8px}
  .kpis div,.stats div{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:10px;min-width:0;
    padding:11px 12px 12px;background:var(--off);border-radius:var(--radius)}
  .kpis b{font-family:var(--sans);font-weight:400;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpis span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
  /* the figures as separate cards with the document cards' own fill (.doc-card), then an Evidence section (9 Nov mockup) */
  .figs{display:flex;flex-direction:column;gap:6px}
  .figs .fig-card{background:var(--off);border-radius:var(--radius);padding:15px 16px 17px;min-width:0}
  .figs .fig-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px}
  .figs .fig-big{display:block;font-family:var(--sans);font-weight:400;font-size:38px;line-height:1.15;padding-bottom:2px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}   /* room for descenders */
  .figs .fig-none{font-family:var(--sans);font-size:15px;color:var(--ink)}   /* a value in words, set like the others */
  .figs .fig-note{font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-top:10px}

  .figs .pres-bar{display:flex;gap:2px;height:6px;margin-top:14px;border-radius:3px;overflow:hidden}

  .figs .pres-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;color:var(--ink-dim)}   /* the document card meta line's colour (.doc-by) */

  .figs .pres-kinds{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;color:var(--ink-dim)}

  .kpis span.kpi-sub{font-size:10px;letter-spacing:0;text-transform:none;margin-top:-4px}
  .stats[hidden]{display:none}
  /* the verbatim passages behind the theme, a document at a time */

  .label.related .txt{font-weight:600}

  .label{transition:opacity .25s}
  .labels.dim .label:not(.active):not(.related):not(.hover){opacity:.26}
  /* the chrome slides left to make room for the panel */
  .topbar,.camera{transition:padding-right .35s cubic-bezier(.2,.7,.2,1),right .35s cubic-bezier(.2,.7,.2,1)}
  #app.panel-open .topbar{padding-right:calc(var(--panel-w,560px) + 22px)}

    #app.panel-open .topbar{padding-right:22px}
    #app.panel-open .camera{right:22px}
  }

  #app:has(.msg:not([hidden])) .loader{display:none}   /* an error replaces the loader */
  .msg{position:absolute;inset:0;display:grid;place-items:center;z-index:9;
    font-family:var(--mono);font-size:13px;color:var(--ink-dim);padding:24px;text-align:center}
  .msg[hidden]{display:none!important}   /* class rule must not defeat the hidden attribute */


  /* ---- 2-D bubbles view ---- */
  .bubbles{position:absolute;top:0;bottom:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;display:none}
  #app.tab-2d .bubbles,#app.tab-split .bubbles,#app.view-fade .bubbles{display:block}
  #app.tab-2d #btnView{display:none}           /* tilt makes no sense in the 2-D view */
  .bubbles .outer{fill:none;stroke-width:1;opacity:.55}
  .bubbles .inner{pointer-events:auto;cursor:pointer;stroke-width:1.2;transition:opacity .25s}
  .bubbles.dim .b:not(.active):not(.related):not(.hover) .inner{opacity:.28}
  .bubbles .b.hover .inner{stroke:var(--label-ink);stroke-opacity:1;stroke-width:1.5}
  .bubbles .b.related .inner{stroke:var(--label-ink);stroke-opacity:.75;stroke-width:1.5}   /* related to the selection: a white edge, no colour */
  .range-labels{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none}   /* under the market names */
  .range-labels.hidden{display:none !important}
  /* a range's name reads exactly like a theme label, just without the marker */
  /* an industry's name over its cluster of markets: a caption, not a peak label, so no marker and no rollover */
  .range-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
  .range-label{opacity:.55;transition:opacity .15s}
  .range-label .txt{display:block;font-size:9px;line-height:1;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;
    text-shadow:none;background:color-mix(in srgb, var(--ground) 70%, transparent);
    border:1px solid color-mix(in srgb, var(--label-ink) 35%, transparent)}
  .range-label.active{opacity:.9}
  .step-tabs .tab.soon{opacity:.5;cursor:default}
  .msg-reload{margin-left:8px;font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;cursor:pointer}
  /* ---- the peak list and its skip link: hidden until focused from the keyboard, then a pill at the foot of the map ---- */
  .sr-only,.peak-list button:not(:focus-visible),.skip-peaks:not(:focus-visible){position:absolute;width:1px;height:1px;
    margin:-1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .peak-list{position:absolute;top:0;left:0;z-index:8}
  .peak-list ul{list-style:none;margin:0;padding:0}
  .peak-list button:focus-visible,.skip-peaks:focus-visible{position:fixed;z-index:8;left:50%;bottom:20px;transform:translateX(-50%);
    max-width:calc(100vw - 44px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.02em;text-decoration:none;color:var(--on-accent);background:var(--label-ink);border:0;border-radius:999px;
    padding:6px 14px;cursor:pointer;outline:2px solid var(--accent);outline-offset:2px}
  #app.panel-open .peak-list button:focus-visible,#app.panel-open .skip-peaks:focus-visible{left:calc((100vw - var(--panel-w,560px)) / 2)}   /* centred in what the panel leaves */
  @media (max-width:640px){ #app.panel-open .peak-list button:focus-visible,#app.panel-open .skip-peaks:focus-visible{left:50%} }
